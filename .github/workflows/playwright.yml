name: Tests
permissions:
  contents: read
on:
  push:
    branches: [main, feat/firebase-migration]
  pull_request:
    branches: [main, feat/firebase-migration]
jobs:
  checks:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm pretty-check
      - name: Lint
        run: pnpm lint
      - name: Run unit tests
        run: pnpm test:unit

  # Runs against the Firebase Auth and Firestore emulators only. No Firebase
  # credentials are available to the job, and the tests refuse to run if any
  # are present.
  firebase:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # The Firestore emulator is a Java program
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Security Rules and seeding tests against the emulators
        run: pnpm test:ci

  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Signing in uses the Firebase Auth emulator, which runs alongside the
      # Firestore emulator, a Java program
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright with deps
        run: pnpm exec playwright install --with-deps
      - name: Cache Next.js build artifacts
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build application ready to test
        run: pnpm exec next build
      - name: Run all Playwright tests against the disposable database and emulators
        run: pnpm test:e2e --no-build
      - name: Rehearse the Postgres to Firestore import
        run: pnpm migrate:rehearse
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
