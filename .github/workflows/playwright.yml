name: Tests
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  checks:
    name: Format, lint and unit tests
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm pretty-check
      - name: Lint
        run: pnpm lint
      - name: Run unit tests
        run: pnpm test:unit

  # Runs against the Firebase Auth and Firestore emulators only. No Firebase
  # credentials are available to the job, and the tests refuse to run if any
  # are present.
  firebase:
    name: Firebase emulator tests
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The Firestore emulator is a Java program
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Security Rules and seeding tests against the emulators
        run: pnpm test:firebase

  e2e:
    name: Browser tests (${{ matrix.shard }}/4)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Signing in uses the Firebase Auth emulator, which runs alongside the
      # Firestore emulator, a Java program
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright with deps
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Cache Next.js build artifacts
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Build application ready to test
        run: pnpm exec next build
        # Served over http://localhost, see next.config.ts and tests/test-env.ts
        env:
          SERVED_OVER_HTTP: "true"
      - name: Run browser shard against the Firebase emulators
        run: pnpm test:e2e --no-build --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: blob-report/
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  browser-result:
    name: End to end tests (Playwright)
    needs: e2e
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: playwright-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Check every shard supplied a report
        shell: bash
        run: |
          shopt -s nullglob
          for shard in 1 2 3 4; do
            reports=(all-blob-reports/*-"$shard".zip)
            if [ "${#reports[@]}" -ne 1 ]; then
              echo "Expected one report from shard $shard, found ${#reports[@]}"
              exit 1
            fi
          done
      - name: Merge browser reports
        run: pnpm exec playwright merge-reports --reporter=html,./tests/reporters/summary.ts all-blob-reports
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          overwrite: true
          if-no-files-found: error
          retention-days: 30
      - name: Require every shard to pass
        if: ${{ always() }}
        env:
          SHARD_RESULT: ${{ needs.e2e.result }}
        run: test "$SHARD_RESULT" = success
