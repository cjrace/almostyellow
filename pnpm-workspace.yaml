allowBuilds:
  "@firebase/util": false
  bufferutil: true
  protobufjs: false
  re2: false
  sharp: true
  unrs-resolver: true

overrides:
  flatted: ">=3.4.2"
  postcss: "8.5.31"
  js-yaml: "4.3.2"
  ws: "8.22.0"
  "@babel/core": "7.29.7"
  brace-expansion@1: "1.1.21"
  brace-expansion@2: "2.1.7"
  brace-expansion@5: "5.0.12"
  "@humanfs/node": ">=0.16.8"
  postcss-selector-parser: ">=7.1.3 <8"
  browserslist: ">=4.28.7"
  # jwks-rsa 4 loads the ESM-only jose 6 with require(), which fails on
  # Vercel. 3.x uses jose 4, which still has a CommonJS build.
  jwks-rsa: "3.2.2"
  "@firebase/firestore>@grpc/grpc-js": "1.13.6"
  "glob@>=9 <14.0.2": "14.0.2"
  # The patches below adapt legacy callers to minimatch's named export.
  "minimatch@<11.0.1": "11.0.1"
  # uuid 11 retains the CommonJS entry point used by gaxios 6.
  "uuid@9": "11.1.1"
  "@google-cloud/pubsub>@opentelemetry/core": "2.8.0"

patchedDependencies:
  firebase-tools@15.34.1: patches/firebase-tools@15.34.1.patch
  superstatic@10.0.0: patches/superstatic@10.0.0.patch
